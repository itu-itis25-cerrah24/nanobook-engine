name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-bench:
    name: g++ build, tests & benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: g++ --version

      - name: Build (g++ -std=c++20 -O3, warnings as errors)
        run: make -j"$(nproc)" all CXX=g++

      - name: Unit tests
        run: make test

      - name: Visualizer snapshot
        run: ./build/nanobook_demo --frames 1 --no-color

      - name: Benchmark sanity check (200k orders, single-thread + 2-thread SPSC pipeline)
        run: ./build/nanobook_bench 200000

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ThreadSanitizer
            flags: -fsanitize=thread
          - name: AddressSanitizer + UBSan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
    steps:
      - uses: actions/checkout@v4

      # Newer runner kernels use 32 bits of mmap ASLR entropy, which TSan's shadow
      # memory layout does not support.
      - name: Reduce ASLR entropy for TSan
        if: matrix.name == 'ThreadSanitizer'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build tests
        run: >
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer ${{ matrix.flags }}
          -Wall -Wextra -Werror -Iinclude
          src/order_book.cpp tests/*.cpp -pthread -o nanobook_tests_san

      - name: Run tests
        run: ./nanobook_tests_san

  cmake:
    name: CMake build & ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build-cmake -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure
